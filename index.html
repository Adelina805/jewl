<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browser jewelry sketchbook for makers and hobbyists. Paint sea glass, draw silver around it, and sketch pendant designs by hand — your hands, your eye, your design."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>jewl — sea glass sketchbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="chrome top">
        <div class="brand">
          <h1>jewl</h1>
          <button type="button" id="download" class="brand-download" title="Download PNG" aria-label="Download PNG">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v12" />
              <path d="M7 10l5 5 5-5" />
              <path d="M5 19h14" />
            </svg>
          </button>
        </div>
        <div class="actions">
          <button type="button" id="undo" class="ghost" title="Undo (⌘Z)" aria-label="Undo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 14L4 9l5-5" />
              <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H14" />
            </svg>
          </button>
          <button type="button" id="redo" class="ghost" title="Redo (⌘⇧Z)" aria-label="Redo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 14l5-5-5-5" />
              <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H10" />
            </svg>
          </button>
          <button type="button" id="delete" class="ghost" title="Delete selected stroke (⌫)" aria-label="Delete" hidden disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M19 6l-1 14H6L5 6" />
              <path d="M10 11v6M14 11v6" />
            </svg>
          </button>
          <button type="button" id="duplicate" class="ghost" title="Duplicate selected stroke (⌘D)" aria-label="Duplicate" hidden disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="8" y="8" width="12" height="12" rx="1.5" />
              <path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8" />
            </svg>
          </button>
          <button type="button" id="clear" class="ghost ghost-label" title="Clear all silver and glass" aria-label="Clear all" hidden>
            Clear
          </button>
        </div>
      </header>

      <main class="stage">
        <canvas id="canvas" aria-label="Jewelry sketch canvas"></canvas>
        <div id="erase-cursor" class="erase-cursor" hidden aria-hidden="true"></div>
      </main>

      <footer class="chrome bottom">
        <div class="dock" role="toolbar" aria-label="Drawing tools">
          <div class="dock-tools" role="group" aria-label="Tools">
            <button
              type="button"
              class="tool-btn active"
              data-tool="draw"
              id="tool-draw"
              title="Draw (D)"
              aria-label="Draw"
              aria-pressed="true"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19l7-7 3 3-7 7-3-3z" />
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
                <path d="M2 2l7.586 7.586" />
              </svg>
            </button>
            <button
              type="button"
              class="tool-btn"
              data-tool="select"
              id="tool-select"
              title="Select (S)"
              aria-label="Select"
              aria-pressed="false"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 4l7.07 17 2.51-7.39L21 11.07 4 4z" />
              </svg>
            </button>
            <button
              type="button"
              class="tool-btn"
              data-tool="erase"
              id="tool-erase"
              title="Eraser (E)"
              aria-label="Eraser"
              aria-pressed="false"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21" />
                <path d="m5.082 11.09 8.828 8.828" />
              </svg>
            </button>
          </div>

          <div class="dock-sep" aria-hidden="true"></div>

          <div class="dock-materials" role="group" aria-label="Materials">
            <div class="material-split" data-material="metal" id="metal-split">
              <button
                type="button"
                class="material-main active"
                id="metal-main"
                title="Metal"
                aria-label="Metal"
                aria-pressed="true"
              >
                <span class="swatch metal" id="metal-swatch" aria-hidden="true"></span>
                <span class="material-label">Metal</span>
              </button>
              <button
                type="button"
                class="material-chevron"
                id="metal-chevron"
                title="Metal presets"
                aria-label="Metal presets"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="metal-library"
              >
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M6 9l6 6 6-6" />
                </svg>
              </button>
              <div class="preset-library" id="metal-library" role="listbox" aria-label="Metal presets" hidden></div>
            </div>

            <div class="material-split" data-material="glass" id="glass-split">
              <button
                type="button"
                class="material-main"
                id="glass-main"
                title="Glass"
                aria-label="Glass"
                aria-pressed="false"
              >
                <span class="swatch" id="glass-swatch" aria-hidden="true"></span>
                <span class="material-label">Glass</span>
              </button>
              <button
                type="button"
                class="material-chevron"
                id="glass-chevron"
                title="Glass presets"
                aria-label="Glass presets"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="glass-library"
              >
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M6 9l6 6 6-6" />
                </svg>
              </button>
              <div class="preset-library" id="glass-library" role="listbox" aria-label="Glass presets" hidden></div>
            </div>
          </div>

          <label class="thickness" for="thickness" id="size-control">
            <span>Size</span>
            <input
              type="range"
              id="thickness"
              min="4"
              max="90"
              value="20"
              aria-valuemin="4"
              aria-valuemax="90"
            />
          </label>
        </div>
      </footer>
    </div>
    <script src="silver-gl.js"></script>
    <script src="app.js"></script>
  </body>
</html>
