<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jewl — sea glass sketchbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="chrome top">
        <div class="brand">
          <h1>jewl</h1>
          <p>sea glass · silver</p>
        </div>
        <div class="actions">
          <button type="button" id="undo" class="ghost" title="Undo last stroke (⌘Z)">
            Undo
          </button>
          <button type="button" id="clear" class="ghost" title="Clear all silver">
            Clear
          </button>
        </div>
      </header>

      <main class="stage">
        <canvas id="canvas" aria-label="Jewelry sketch canvas"></canvas>
      </main>

      <footer class="chrome bottom">
        <div class="modes" role="group" aria-label="Tool">
          <button type="button" class="mode active" data-mode="draw" id="mode-draw">
            Silver
          </button>
          <button type="button" class="mode" data-mode="move" id="mode-move">
            Place
          </button>
        </div>

        <label class="thickness" for="thickness">
          <span>Weight</span>
          <input
            type="range"
            id="thickness"
            min="4"
            max="36"
            value="14"
            aria-valuemin="4"
            aria-valuemax="36"
          />
        </label>

        <p class="hint" id="hint">Draw silver around the glass. Switch to Place to move or rotate.</p>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
